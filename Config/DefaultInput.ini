; Enhanced Input is configured in Blueprint (IMC_VerdunSoldier)
; This file retains legacy axis mappings as fallback

[/Script/Engine.InputSettings]
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Crouch",Key=Gamepad_FaceButton_Right)

+AxisMappings=(AxisName="MoveForward",Key=W,Scale=1.0)
+AxisMappings=(AxisName="MoveForward",Key=S,Scale=-1.0)
+AxisMappings=(AxisName="MoveForward",Key=Gamepad_LeftY,Scale=1.0)

+AxisMappings=(AxisName="MoveRight",Key=A,Scale=-1.0)
+AxisMappings=(AxisName="MoveRight",Key=D,Scale=1.0)
+AxisMappings=(AxisName="MoveRight",Key=Gamepad_LeftX,Scale=1.0)

+AxisMappings=(AxisName="Turn",Key=MouseX,Scale=1.0)
+AxisMappings=(AxisName="LookUp",Key=MouseY,Scale=-1.0)
+AxisMappings=(AxisName="Turn",Key=Gamepad_RightX,Scale=1.0)
+AxisMappings=(AxisName="LookUp",Key=Gamepad_RightY,Scale=-1.0)

; Mouse sensitivity
bEnableMouseSmoothing=False
MouseSensitivityX=0.1
MouseSensitivityY=0.1
